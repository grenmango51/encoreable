# On every push: the fast checks from AGENTS.md's "Done means". The full score
# runs on the Aalto workstations; this only catches what breaks in minutes.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # One benchmark case, graded and compared with the baseline.
      - run: npm run score -- --only fuzz:101 --views p2@p1 --threads 1
      - run: npm run extension -- --check
